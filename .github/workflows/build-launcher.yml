name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    branches:
      - hackathon-v3
      - main
    tags:
      - "launcher-v*"
    paths:
      - "launcher/**"
      - "build-launcher.bat"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore launcher/Postupashki.Launcher.csproj

      - name: Publish single EXE
        run: >-
          dotnet publish launcher/Postupashki.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output launcher/publish

      - name: Verify artifact
        shell: pwsh
        run: |
          $path = "launcher/publish/PostupashkiLauncher.exe"
          if (-not (Test-Path $path)) {
            throw "Launcher executable was not created: $path"
          }
          Get-Item $path | Format-List Name, Length, LastWriteTime

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: postupashki-windows-launcher
          path: launcher/publish/PostupashkiLauncher.exe
          if-no-files-found: error

      - name: Create tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          launcher/publish/PostupashkiLauncher.exe
          --title "Поступашки Launcher $env:GITHUB_REF_NAME"
          --generate-notes

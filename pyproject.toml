[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "postupashki-measurement-mvp"
version = "0.1.0"
description = "Marketing measurement MVP for the Postupashki hackathon case"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.40,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

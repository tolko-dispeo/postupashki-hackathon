name: postupashki

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/runtime/postupashki_mvp_large_demo.sqlite3
      APP_ENV: docker
      IDENTITY_HASH_SECRET: local-docker-demo-only
    volumes:
      - postupashki-data:/app/runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_DATA_SOURCE: api
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  postupashki-data:

